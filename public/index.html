<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AzureChat — Real-time Messenger</title>
  <script src="/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base:    #080b10;
      --bg-panel:   #0d1117;
      --bg-card:    #111820;
      --bg-hover:   #161e28;
      --border:     #1e2d3d;
      --accent:     #00d4ff;
      --accent2:    #0088aa;
      --accent-glow:#00d4ff33;
      --green:      #39d353;
      --red:        #ff4757;
      --yellow:     #ffd700;
      --text-1:     #e6edf3;
      --text-2:     #8b949e;
      --text-3:     #3d444d;
      --radius:     10px;
      --font-mono:  'JetBrains Mono', monospace;
      --font-sans:  'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-1);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    /* ── GRID LAYOUT ── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      gap: 0;
    }

    /* ── TOPBAR ── */
    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 14px;
    }
    .logo span { color: var(--accent); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-2);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── SIDEBAR ── */
    #sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 16px 14px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-3);
      text-transform: uppercase;
    }

    .room-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }

    .room-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-2);
      transition: all 0.15s;
      margin-bottom: 2px;
    }
    .room-item:hover { background: var(--bg-hover); color: var(--text-1); }
    .room-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent2);
    }
    .room-item .room-hash { color: var(--text-3); font-size: 14px; }
    .room-item.active .room-hash { color: var(--accent); }
    .room-badge {
      margin-left: auto;
      background: var(--accent);
      color: var(--bg-base);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }

    /* Custom room input */
    .room-create {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .room-create input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-1);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    .room-create input:focus { border-color: var(--accent); }
    .room-create input::placeholder { color: var(--text-3); }

    /* User info at bottom */
    .sidebar-user {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--bg-base);
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 500; truncate: ellipsis; white-space: nowrap; overflow: hidden; }
    .user-status { font-size: 11px; color: var(--green); }

    /* ── MAIN CHAT ── */
    #main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Chat header */
    #chat-header {
      padding: 12px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-room-name {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-room-name .hash { color: var(--accent); }
    .online-count {
      font-size: 12px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Messages area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Message groups */
    .msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      animation: fadeSlideIn 0.2s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .msg-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }
    .msg-author.self { color: var(--yellow); }
    .msg-time {
      font-size: 10px;
      color: var(--text-3);
    }

    .msg-bubble {
      display: inline-block;
      max-width: 72%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0 8px 8px 8px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-1);
      word-break: break-word;
    }
    .msg-bubble.self {
      background: #0a1f2e;
      border-color: var(--accent2);
      border-radius: 8px 0 8px 8px;
      margin-left: auto;
      color: var(--text-1);
    }
    .msg-group.self {
      align-items: flex-end;
    }
    .msg-group.self .msg-meta {
      flex-direction: row-reverse;
    }
    .msg-group.self .msg-author { color: var(--yellow); }

    /* System messages */
    .msg-system {
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      padding: 4px 0;
      font-style: italic;
    }

    /* File message */
    .msg-file {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
    }
    .msg-file:hover { text-decoration: underline; }

    /* Typing indicator */
    #typing-indicator {
      padding: 4px 20px 8px;
      font-size: 11px;
      color: var(--text-2);
      height: 22px;
      font-style: italic;
    }

    /* ── INPUT AREA ── */
    #input-area {
      padding: 12px 20px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #msg-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-1);
      font-family: var(--font-mono);
      font-size: 13px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #msg-input::placeholder { color: var(--text-3); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      width: 32px; height: 32px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 15px;
      transition: all 0.15s;
      background: transparent;
      color: var(--text-2);
    }
    .btn-icon:hover { background: var(--bg-hover); color: var(--text-1); }

    .btn-send {
      background: var(--accent);
      color: var(--bg-base);
      width: 34px; height: 34px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-send:hover { background: #00bbdd; transform: scale(1.05); }
    .btn-send:active { transform: scale(0.95); }
    .btn-send:disabled { background: var(--text-3); cursor: not-allowed; transform: none; }

    /* ── LOGIN OVERLAY ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .login-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 380px;
      text-align: center;
    }

    .login-logo {
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .login-logo span { color: var(--accent); }

    .login-subtitle {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 32px;
    }

    .login-field {
      margin-bottom: 14px;
      text-align: left;
    }
    .login-field label {
      display: block;
      font-size: 11px;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .login-field input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-1);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: var(--accent); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: var(--bg-base);
      border: none;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .btn-login:hover { background: #00bbdd; }
    .btn-login:active { transform: scale(0.98); }

    .login-hint {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-3);
    }

    /* ── SCAN LINE EFFECT ── */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── SCROLLBAR ── */
    .room-list::-webkit-scrollbar { width: 3px; }
    .room-list::-webkit-scrollbar-thumb { background: var(--border); }

    /* ── USERS PANEL ── */
    .users-list {
      padding: 0 8px 8px;
      max-height: 140px;
      overflow-y: auto;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text-2);
      border-radius: 5px;
    }
    .user-chip .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    #file-input { display: none; }

    /* Responsive */
    @media (max-width: 600px) {
      #app { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">Azure<span>Chat</span></div>
    <div class="login-subtitle">Real-time messaging · Powered by Socket.io + Azure</div>

    <div class="login-field">
      <label>USERNAME</label>
      <input id="login-username" type="text" placeholder="e.g. john_doe" maxlength="20" autocomplete="off" />
    </div>
    <div class="login-field">
      <label>JOIN ROOM</label>
      <input id="login-room" type="text" placeholder="e.g. general" value="general" maxlength="30" autocomplete="off" />
    </div>
    <button class="btn-login" onclick="doLogin()">CONNECT →</button>
    <div class="login-hint">No account needed. Just pick a username.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      Azure<span>Chat</span>
    </div>
    <div class="topbar-right">
      <div class="status-dot" id="conn-dot"></div>
      <span id="conn-label">Connecting...</span>
      <span id="topbar-user" style="color:var(--accent)"></span>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-section">Rooms</div>
    <div class="room-list" id="room-list">
      <div class="room-item active" data-room="general" onclick="switchRoom('general')">
        <span class="room-hash">#</span> general
      </div>
      <div class="room-item" data-room="random" onclick="switchRoom('random')">
        <span class="room-hash">#</span> random
      </div>
      <div class="room-item" data-room="tech" onclick="switchRoom('tech')">
        <span class="room-hash">#</span> tech
      </div>
      <div class="room-item" data-room="azure" onclick="switchRoom('azure')">
        <span class="room-hash">#</span> azure
      </div>
    </div>

    <div class="room-create">
      <input id="new-room-input" type="text" placeholder="# join custom room..." maxlength="30"
        onkeydown="if(event.key==='Enter') joinCustomRoom()" />
    </div>

    <div class="sidebar-section" style="margin-top:8px">Online</div>
    <div class="users-list" id="users-list"></div>

    <div class="sidebar-user">
      <div class="avatar" id="sidebar-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-username">—</div>
        <div class="user-status">● online</div>
      </div>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div id="main">
    <div id="chat-header">
      <div class="chat-room-name">
        <span class="hash">#</span>
        <span id="header-room">general</span>
      </div>
      <div class="online-count">
        <div class="status-dot"></div>
        <span id="online-count">0 online</span>
      </div>
    </div>

    <div id="messages"></div>
    <div id="typing-indicator"></div>

    <div id="input-area">
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="Message #general..."
          onkeydown="handleKeyDown(event)"
          oninput="handleTyping()"></textarea>
        <div class="input-actions">
          <button class="btn-icon" title="Attach file" onclick="document.getElementById('file-input').click()">📎</button>
          <input type="file" id="file-input" onchange="sendFile(this)" />
          <button class="btn-send" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Socket.io client from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<script>
// ============================================================
// CONFIG
// ============================================================
const BACKEND_URL = window.BACKEND_URL || "http://localhost:3001";
let socket = null;
let currentUser = "";
let currentRoom = "general";
let typingTimer = null;
let isTyping = false;
const unreadCounts = {};

// ============================================================
// LOGIN
// ============================================================
function doLogin() {
  const username = document.getElementById("login-username").value.trim();
  const room = document.getElementById("login-room").value.trim() || "general";

  if (!username) {
    document.getElementById("login-username").style.borderColor = "var(--red)";
    return;
  }

  currentUser = username;
  currentRoom = room;

  document.getElementById("login-overlay").style.display = "none";
  document.getElementById("topbar-user").textContent = username;
  document.getElementById("sidebar-username").textContent = username;
  document.getElementById("sidebar-avatar").textContent = username[0].toUpperCase();
  document.getElementById("msg-input").placeholder = `Message #${currentRoom}...`;

  initSocket();
}

document.getElementById("login-username").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin();
});
document.getElementById("login-room").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin();
});

// ============================================================
// SOCKET.IO
// ============================================================
function initSocket() {
  socket = io(BACKEND_URL, {
    transports: ["websocket", "polling"],
    reconnectionAttempts: 5,
    reconnectionDelay: 1000,
  });

  socket.on("connect", () => {
    setConnStatus(true);
    socket.emit("join_room", { username: currentUser, room: currentRoom });
    updateActiveRoom(currentRoom);
  });

  socket.on("disconnect", () => setConnStatus(false));
  socket.on("connect_error", () => setConnStatus(false));

  socket.on("chat_history", ({ room, messages }) => {
    const container = document.getElementById("messages");
    container.innerHTML = "";
    messages.forEach(renderMessage);
    scrollToBottom();
  });

  socket.on("receive_message", (msg) => {
    renderMessage(msg);
    scrollToBottom();
  });

  socket.on("user_joined", ({ username, room, userCount, users }) => {
    if (room !== currentRoom) return;
    addSystemMessage(`${username} joined the room`);
    updateOnlineCount(userCount);
    renderUserList(users);
  });

  socket.on("user_left", ({ username, room, userCount }) => {
    if (room !== currentRoom) return;
    addSystemMessage(`${username} left the room`);
    updateOnlineCount(userCount);
  });

  socket.on("user_typing", ({ username, isTyping }) => {
    const el = document.getElementById("typing-indicator");
    el.textContent = isTyping ? `${username} is typing...` : "";
  });
}

// ============================================================
// SEND MESSAGE
// ============================================================
function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !socket) return;

  socket.emit("send_message", { text, type: "text" });
  input.value = "";
  input.style.height = "auto";
  stopTyping();
}

function handleKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  // Auto-resize textarea
  const ta = document.getElementById("msg-input");
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
}

// ============================================================
// TYPING INDICATOR
// ============================================================
function handleTyping() {
  if (!socket) return;
  if (!isTyping) {
    isTyping = true;
    socket.emit("typing", { isTyping: true });
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2000);

  // Resize textarea
  const ta = document.getElementById("msg-input");
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
}

function stopTyping() {
  if (isTyping && socket) {
    isTyping = false;
    socket.emit("typing", { isTyping: false });
  }
}

// ============================================================
// FILE UPLOAD
// ============================================================
async function sendFile(input) {
  const file = input.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);

  try {
    addSystemMessage(`Uploading ${file.name}...`);
    const res = await fetch(`${BACKEND_URL}/api/upload`, { method: "POST", body: formData });
    const data = await res.json();
    if (data.url) {
      socket.emit("send_file", { fileUrl: data.url, filename: file.name });
    } else {
      addSystemMessage("File upload failed.");
    }
  } catch (err) {
    addSystemMessage("File upload error: " + err.message);
  }
  input.value = "";
}

// ============================================================
// ROOM MANAGEMENT
// ============================================================
function switchRoom(room) {
  if (room === currentRoom || !socket) return;
  currentRoom = room;
  socket.emit("join_room", { username: currentUser, room });
  updateActiveRoom(room);
  document.getElementById("header-room").textContent = room;
  document.getElementById("msg-input").placeholder = `Message #${room}...`;
  document.getElementById("messages").innerHTML = "";
  updateOnlineCount(0);
}

function joinCustomRoom() {
  const input = document.getElementById("new-room-input");
  const room = input.value.trim().toLowerCase().replace(/\s+/g, "-");
  if (!room) return;

  const list = document.getElementById("room-list");
  if (!list.querySelector(`[data-room="${room}"]`)) {
    const item = document.createElement("div");
    item.className = "room-item";
    item.dataset.room = room;
    item.onclick = () => switchRoom(room);
    item.innerHTML = `<span class="room-hash">#</span> ${room}`;
    list.appendChild(item);
  }

  switchRoom(room);
  input.value = "";
}

function updateActiveRoom(room) {
  document.querySelectorAll(".room-item").forEach(el => {
    el.classList.toggle("active", el.dataset.room === room);
  });
}

// ============================================================
// RENDER HELPERS
// ============================================================
let lastAuthor = "";

function renderMessage(msg) {
  const container = document.getElementById("messages");
  const isSelf = msg.username === currentUser;
  const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  const group = document.createElement("div");
  group.className = `msg-group ${isSelf ? "self" : ""}`;

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  meta.innerHTML = `
    <span class="msg-author ${isSelf ? "self" : ""}">${msg.username}</span>
    <span class="msg-time">${time}</span>
  `;

  const bubble = document.createElement("div");
  bubble.className = `msg-bubble ${isSelf ? "self" : ""}`;

  if (msg.type === "file" && msg.fileUrl) {
    bubble.innerHTML = `<a class="msg-file" href="${msg.fileUrl}" target="_blank">📎 ${escapeHtml(msg.text)}</a>`;
  } else {
    bubble.textContent = msg.text;
  }

  group.appendChild(meta);
  group.appendChild(bubble);
  container.appendChild(group);
}

function addSystemMessage(text) {
  const container = document.getElementById("messages");
  const el = document.createElement("div");
  el.className = "msg-system";
  el.textContent = text;
  container.appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  const el = document.getElementById("messages");
  el.scrollTop = el.scrollHeight;
}

function updateOnlineCount(count) {
  document.getElementById("online-count").textContent = `${count} online`;
}

function renderUserList(users) {
  const el = document.getElementById("users-list");
  el.innerHTML = users.map(u => `
    <div class="user-chip">
      <div class="dot"></div>
      ${escapeHtml(u)}
    </div>
  `).join("");
}

function setConnStatus(online) {
  const dot = document.getElementById("conn-dot");
  const label = document.getElementById("conn-label");
  dot.className = "status-dot" + (online ? "" : " offline");
  label.textContent = online ? "Connected" : "Reconnecting...";
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
